[tools]
shellcheck = "latest"
shfmt = "latest"

# GNU coreutils - available as 'coreutils' package
# This provides GNU versions of common utilities like realpath, stat, etc.
# Used by git-deps for cross-platform compatibility
coreutils = "latest"

[settings]
# Enable experimental features if needed for certain tools
experimental = true

[env]
# Ensure coreutils are in PATH before system utilities
_.path = [
  "{{ config_root }}/.mise/installs/coreutils/latest/bin",
]